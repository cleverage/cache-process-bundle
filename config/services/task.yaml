services:
    _defaults:
        # Public for the direct access from the service container, deprecated since 2.3: private in 3.0
        public: true
        tags:
            - { name: container.private, package: cleverage/cache-process-bundle, version: '2.3' }

    CleverAge\CacheProcessBundle\Task\GetTask:
        shared: false
        arguments:
            - '@cleverage_cache_process.registry.adapter'
        tags:
            - { name: cleverage.task, code: cache_get }
    cleverage_cache_process.task.get:
        alias: CleverAge\CacheProcessBundle\Task\GetTask
        public: false
        deprecated:
            package: cleverage/cache-process-bundle
            version: '2.3'
            message: 'The "%alias_id%" service alias is deprecated, use the "cache_get" task code or the class name of the task instead. It will be removed in 3.0.'

    CleverAge\CacheProcessBundle\Task\SetTask:
        shared: false
        arguments:
            - '@cleverage_cache_process.registry.adapter'
        tags:
            - { name: cleverage.task, code: cache_set }
    cleverage_cache_process.task.set:
        alias: CleverAge\CacheProcessBundle\Task\SetTask
        public: false
        deprecated:
            package: cleverage/cache-process-bundle
            version: '2.3'
            message: 'The "%alias_id%" service alias is deprecated, use the "cache_set" task code or the class name of the task instead. It will be removed in 3.0.'
